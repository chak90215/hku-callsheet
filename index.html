<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Call Sheet V8 | May 18 - 2026</title>
    <style>
        :root {
            --bg-color: #f9f9fa;
            --text-main: #333;
            --text-muted: #888;
            --green-tag: #c8e6c9;
            --blue-tag: #bbdefb;
            --border-color: #eee;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            min-height: 100vh;
            padding-bottom: 40px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        .header {
            padding: 20px 20px 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            margin: 0 0 5px 0;
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .header .version {
            font-size: 12px;
            background: #333;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            vertical-align: middle;
            margin-left: 8px;
        }

        .header .date {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-cards {
            display: flex;
            padding: 15px 20px;
            gap: 15px;
        }

        .card {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
        }

        .card span {
            display: block;
            font-size: 14px;
            color: #ccc;
            margin-top: 5px;
            font-weight: normal;
            text-transform: none;
        }
