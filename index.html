<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Call Sheet Batch 2 (V5 - Single MUA) | May 26 - 2026</title>
    <style>
        :root {
            --bg-color: #f9f9fa;
            --text-main: #333;
            --text-muted: #888;
            --green-tag: #c8e6c9;
            --blue-tag: #bbdefb;
            --yellow-tag: #ffecb3;
            --border-color: #eee;
            --primary: #1a365d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            min-height: 100vh;
            padding-bottom: 40px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        .header {
            padding: 20px 20px 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            margin: 0 0 5px 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: var(--primary);
        }

        .header .version {
            font-size: 11px;
            background: #e53e3e;
            color: #fff;
            padding: 3px 6px;
            border-radius: 4px;
            vertical-align: middle;
            margin-left: 8px;
            font-weight: bold;
        }

        .header .date {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .info-cards {
            display: flex;
            padding: 15px 20px;
            gap: 10px;
        }

        .card {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
            text-align: center;
            background: #fafafa;
        }

        .card span {
            display: block;
            font-size: 15px;
            color: var(--primary);
            margin-top: 5px;
            font-weight: 700;
            text-transform: none;
        }

        /* Talent Grid */
        .talent-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px 5px;
            padding: 15px 20px;
            background: #fff;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 10px -6px rgba(0,0,0,0.1);
        }

        .talent-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .talent-item.inactive {
            opacity: 0.25;
            filter: grayscale(100%);
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }

        .talent-item:active .avatar {
            transform: scale(0.9);
        }

        .talent-name {
            font-size: 10px;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
        }

        /* Timeline */
        .timeline {
            padding: 20px 15px;
        }

        .row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            background: #fff;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 12px 10px;
            transition: opacity 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
        }

        body.is-filtered .row.dimmed {
            opacity: 0.15;
        }

        body.is-filtered .row.highlight {
            opacity: 1;
            border-color: #3182ce;
            box-shadow: 0 4px 12px rgba(49, 130, 206, 0.15);
            transform: scale(1.02);
            background: #fff;
        }
